# Declared explicitly so `pip install .` does not depend on pip's
# legacy fallback, which is what CI was quietly relying on.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "command-control-dashboard"
version = "0.1.0"
description = "Transparent life + agent cockpit: project radar, approvals, browser queue, artifacts, handoffs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "coincurve>=21.0.0",
  "websocket-client>=1.9.0",
]

# Nothing here is importable as a package. `fleet/`, `legacy/` and `data/` are
# a running system, not a library, and the tests reach them through
# pythonpath below rather than through an install. So `pip install .` exists
# only to resolve dependencies, and setuptools is told to package nothing
# rather than left to guess.
#
# Without this it guessed, and refused: "Multiple top-level packages discovered
# in a flat-layout: ['data', 'fleet', 'legacy', 'githooks']". CI ran
# `pip install .` as its second step and would have died there - a failure that
# had been waiting since the workflow was written, unseen because the workflow
# had never started.
[tool.setuptools]
packages = []

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  # starlette.testclient requires httpx2; the old httpx pin made every
  # http test fail at collection rather than at assert.
  "httpx2>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "legacy"]

# Coverage. 645 tests passing said nothing about which lines run: on
# 2026-08-26 the first measurement came back 44%, with 25 files at zero.
# The number is recorded here so it can only be argued with, not forgotten.
#
#   .venv/bin/python -m coverage run -m pytest -q
#   .venv/bin/python -m coverage report -m
#
# No fail_under yet. A gate set above the truth turns every unrelated pull
# request red, and a gate set at the truth is the truth with extra steps.
[tool.coverage.run]
source = ["fleet/bin", "legacy/app", "self-improve/loop"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
