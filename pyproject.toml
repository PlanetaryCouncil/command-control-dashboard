[project]
name = "command-control-dashboard"
version = "0.1.0"
description = "Transparent life + agent cockpit: project radar, approvals, browser queue, artifacts, handoffs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "legacy"]
