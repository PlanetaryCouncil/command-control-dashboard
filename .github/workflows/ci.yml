name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The fleet runs 3.14, and 3.14 is deliberately absent here: cffi has
        # no wheel for it yet and its sdist fails to build at all -
        # "Expected exactly one LICENSE file in cffi distribution, got 0".
        # That is a packaging bug in a transitive dependency, not something
        # this repo can fix, and pinning CI to a version that cannot install
        # buys a permanently red badge instead of a signal.
        #
        # 3.13 is the closest thing that installs. Add 3.14 back the day cffi
        # ships a wheel for it.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Runtime deps come from pyproject; the test tools are explicit so CI
          # does not depend on a PEP-735 --group flag being available.
          pip install .
          # httpx2, not httpx: starlette.testclient moved, and with the old one
          # every http test fails at collection rather than at assert. That bug
          # sat here unnoticed because this workflow had never run.
          pip install pytest httpx2

      - name: Run the full test suite
        run: pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependency vulnerability audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install .
          # Report, but do not fail the build on advisories yet: this is a
          # signal to act, not a gate, until the dependency set is pinned.
          pip-audit || true
