name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One version, on purpose. A matrix is a promise to support a range, and
      # this is one system running on two machines rather than a library other
      # people install - so the useful question is "does it run", not "does it
      # run everywhere".
      #
      # 3.11 because it is the floor pyproject already declares, and because it
      # is what the laptop serving the public board actually runs. Testing the
      # floor is the cheap half of a range: code that works on the oldest
      # supported version usually works above it, and the reverse is not true.
      #
      # The NUC runs 3.14 and is therefore untested here. It cannot be tested
      # here either - cffi has no 3.14 wheel and its sdist will not build - so
      # this is a known gap rather than an oversight.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Runtime deps come from pyproject; the test tools are explicit so CI
          # does not depend on a PEP-735 --group flag being available.
          pip install .
          # httpx2, not httpx: starlette.testclient moved, and with the old one
          # every http test fails at collection rather than at assert. That bug
          # sat here unnoticed because this workflow had never run.
          pip install pytest httpx2

      - name: Run the full test suite
        run: pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependency vulnerability audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install .
          # Report, but do not fail the build on advisories yet: this is a
          # signal to act, not a gate, until the dependency set is pinned.
          pip-audit || true
